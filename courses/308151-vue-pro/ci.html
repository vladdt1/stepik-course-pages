<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверки перед публикацией</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#203b48;font:16px/1.55 system-ui}main{padding:14px;max-width:1000px;margin:auto}h2{font-size:19px;margin:0 0 8px}button,input,select{font:inherit;padding:9px;border:1px solid #639aa9;border-radius:8px;max-width:100%}button{cursor:pointer;background:white;color:#164555}button:disabled{opacity:.5;cursor:default}.box{border:1px solid #b8d7df;border-radius:12px;padding:14px;margin:12px 0;background:#eef7fa}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{padding:10px;margin:7px 0;background:#fff;border-radius:8px;border:1px solid #b8d7df}label{display:block}#feedback{min-height:26px;color:#7b378f}#progress{color:#087257;font-weight:600}small{font-size:14px}code{background:#e4eef4;padding:2px 4px}input[type=checkbox]{width:20px;height:20px}p{margin:9px 0}.box{padding:10px;margin:9px 0}main{padding:10px}button{padding:7px 9px}@media(max-width:520px){body{font-size:14px;line-height:1.4}h2{font-size:17px}button,input,select{font-size:14px}small{font-size:13px}.row{gap:7px}}</style><main><h2>Проверки перед публикацией</h2><p>Запустите проверки. Затем внесите ошибку теста и убедитесь, что публикация закрыта. Исправьте и повторите.</p><p id="progress">Выполнено 0 из 2</p><label><input id="broken" type="checkbox"> В проекте сломан тест</label><div class="row"><button id="run">Запустить проверки</button><button id="publish" disabled>Опубликовать</button></div><div id="pipeline" class="box">Проверки не запускались</div><p id="release">Публикации ещё не было</p><p id="feedback" role="status" aria-live="polite"></p><div class="row"><button id="hint">Небольшая подсказка</button><button id="reset">Начать заново</button></div></main><script>const HINTS=["Проверьте, что происходит с публикацией при сломанном тесте.", "После исправления повторите проверки, а не только нажатие публикации."];const $=s=>document.querySelector(s);let completed=new Set();let hintIndex=0;function pass(key,text){completed.add(key);$('#progress').textContent=`Выполнено ${completed.size} из 2`;$('#feedback').textContent=text}function say(t){$('#feedback').textContent=t}$('#hint').onclick=()=>{say(HINTS[Math.min(hintIndex++,HINTS.length-1)])};$('#reset').onclick=()=>location.reload();let valid=false,failedOnce=false;$('#broken').onchange=()=>{valid=false;$('#publish').disabled=true;$('#pipeline').textContent='Код изменился: нужны новые проверки'};$('#run').onclick=()=>{valid=!$('#broken').checked;$('#pipeline').textContent=valid?'ESLint ✓ → формат ✓ → unit ✓ → API ✓ → build ✓ → E2E ✓':'ESLint ✓ → формат ✓ → unit ✗ → следующие шаги не запускались';$('#publish').disabled=!valid;if(!valid){failedOnce=true;pass(1,'Сбой проверки остановил дальнейшие действия.')}else if(failedOnce)say('Проверки прошли на исправленном коде.')};$('#publish').onclick=()=>{if(!valid)return;$('#release').textContent='Опубликован проверенный вариант';if(failedOnce)pass(2,'Публикация доступна после нового успешного прогона.')}</script></html>
