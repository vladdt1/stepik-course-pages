<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 409" role="img"><rect width="440" height="409" rx="18" fill="#f2f8fb"/><text x="220" y="32" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#253744">Тяжёлую панель можно загрузить</text><text x="220" y="59" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#253744">позже</text><circle cx="27" cy="93" r="7" fill="#087c9e"/><text x="47" y="99" font-family="sans-serif" font-size="19" fill="#087c9e">Старт</text><text x="47" y="126" font-family="sans-serif" font-size="18" fill="#253744">Код каталога</text><circle cx="27" cy="193" r="7" fill="#7c3eb1"/><text x="47" y="199" font-family="sans-serif" font-size="19" fill="#7c3eb1">Открытие отчёта</text><text x="47" y="226" font-family="sans-serif" font-size="18" fill="#253744">Запрос отдельного модуля</text><circle cx="27" cy="293" r="7" fill="#168766"/><text x="47" y="299" font-family="sans-serif" font-size="19" fill="#168766">Следующее открытие</text><text x="47" y="326" font-family="sans-serif" font-size="18" fill="#253744">Ресурс уже может быть в кеше</text></svg>