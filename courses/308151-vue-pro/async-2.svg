<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 409" role="img"><rect width="440" height="409" rx="18" fill="#f2f8fb"/><text x="220" y="32" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#253744">Пустой отчёт и ошибка загрузки —</text><text x="220" y="59" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#253744">разные состояния</text><circle cx="27" cy="93" r="7" fill="#087c9e"/><text x="47" y="99" font-family="sans-serif" font-size="19" fill="#087c9e">Загрузка кода</text><text x="47" y="126" font-family="sans-serif" font-size="18" fill="#253744">Индикатор панели</text><circle cx="27" cy="193" r="7" fill="#7c3eb1"/><text x="47" y="199" font-family="sans-serif" font-size="19" fill="#7c3eb1">Ошибка кода</text><text x="47" y="226" font-family="sans-serif" font-size="18" fill="#253744">Отдельное сообщение</text><circle cx="27" cy="293" r="7" fill="#168766"/><text x="47" y="299" font-family="sans-serif" font-size="19" fill="#168766">Код загружен</text><text x="47" y="326" font-family="sans-serif" font-size="18" fill="#253744">Сама панель запрашивает данные</text></svg>