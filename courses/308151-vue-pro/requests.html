<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Как старый ответ затирает новый</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#203b48;font:16px/1.55 system-ui}main{padding:14px;max-width:1000px;margin:auto}h2{font-size:19px;margin:0 0 8px}button,input,select{font:inherit;padding:9px;border:1px solid #639aa9;border-radius:8px;max-width:100%}button{cursor:pointer;background:white;color:#164555}button:disabled{opacity:.5;cursor:default}.box{border:1px solid #b8d7df;border-radius:12px;padding:14px;margin:12px 0;background:#eef7fa}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{padding:10px;margin:7px 0;background:#fff;border-radius:8px;border:1px solid #b8d7df}label{display:block}#feedback{min-height:26px;color:#7b378f}#progress{color:#087257;font-weight:600}small{font-size:14px}code{background:#e4eef4;padding:2px 4px}input[type=checkbox]{width:20px;height:20px}p{margin:9px 0}.box{padding:10px;margin:9px 0}main{padding:10px}button{padding:7px 9px}@media(max-width:520px){body{font-size:14px;line-height:1.4}h2{font-size:17px}button,input,select{font-size:14px}small{font-size:13px}.row{gap:7px}}</style><main><h2>Как старый ответ затирает новый</h2><p>Отправьте запрос A, затем B. Доставьте ответ B раньше A. Повторите с защитой версии.</p><p id="progress">Выполнено 0 из 2</p><div class="row"><button id="a">Запрос A</button><button id="b">Запрос B</button><label><input id="guard" type="checkbox"> Защита версии</label></div><div id="pending" class="box">Запросов пока нет</div><div class="box">Список на экране: <strong id="value">—</strong></div><p id="feedback" role="status" aria-live="polite"></p><div class="row"><button id="hint">Небольшая подсказка</button><button id="reset">Начать заново</button></div></main><script>const HINTS=["Сеть не обязана возвращать ответы в порядке отправки.", "После воспроизведения ошибки включите защиту и создайте новую пару запросов."];const $=s=>document.querySelector(s);let completed=new Set();let hintIndex=0;function pass(key,text){completed.add(key);$('#progress').textContent=`Выполнено ${completed.size} из 2`;$('#feedback').textContent=text}function say(t){$('#feedback').textContent=t}$('#hint').onclick=()=>{say(HINTS[Math.min(hintIndex++,HINTS.length-1)])};$('#reset').onclick=()=>location.reload();let version=0,pending=[];function render(){$('#pending').replaceChildren();for(const q of pending.filter(q=>!q.done)){const b=document.createElement('button');b.textContent='Доставить ответ '+q.name;b.onclick=()=>{q.done=true;if(!$('#guard').checked||q.version===version){$('#value').textContent=q.name}else say('Ответ '+q.name+' устарел и не применён.');if(q.name==='A'&&pending.some(x=>x.name==='B'&&x.done)){if($('#guard').checked&&$('#value').textContent==='B')pass(2,'Актуальный результат сохранился несмотря на порядок сети.');else if(!$('#guard').checked)pass(1,'На экране оказался старый ответ. Вы воспроизвели ошибку.')}render()};$('#pending').append(b)}}for(const name of ['a','b'])$('#'+name).onclick=()=>{pending.push({name:name.toUpperCase(),version:++version,done:false});render()};</script></html>
