<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 382" role="img"><rect width="440" height="382" rx="18" fill="#f2f8fb"/><text x="220" y="32" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#253744">Скрыт, деактивирован и уничтожен</text><circle cx="27" cy="66" r="7" fill="#087c9e"/><text x="47" y="72" font-family="sans-serif" font-size="19" fill="#087c9e">Активна</text><text x="47" y="99" font-family="sans-serif" font-size="18" fill="#253744">Ресурсы видимой вкладки работают</text><circle cx="27" cy="166" r="7" fill="#7c3eb1"/><text x="47" y="172" font-family="sans-serif" font-size="19" fill="#7c3eb1">Деактивирована</text><text x="47" y="199" font-family="sans-serif" font-size="18" fill="#253744">Ненужные таймеры остановлены</text><circle cx="27" cy="266" r="7" fill="#168766"/><text x="47" y="272" font-family="sans-serif" font-size="19" fill="#168766">Обновлена страница</text><text x="47" y="299" font-family="sans-serif" font-size="18" fill="#253744">Память приложения создана заново</text></svg>