<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img"><rect width="440" height="520" rx="18" fill="#f2f8fb"/><text x="220" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#253744">Неудобные ответы тоже входят в</text><text x="220" y="55" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#253744">контракт</text><rect x="35" y="100" width="370" height="85" rx="12" fill="#fff" stroke="#087c9e" stroke-width="2"/><text x="220.0" y="128" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#087c9e">Управляемый ответ</text><text x="220.0" y="155" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#253744">Запрос ещё не завершён</text><path d="M220 185 L220 230" fill="none" stroke="#087c9e" stroke-width="3"/><path d="M215 222 L220 230 L225 222" fill="none" stroke="#087c9e" stroke-width="3"/><rect x="20" y="235" width="185" height="110" rx="12" fill="#f5effa" stroke="#7c3eb1" stroke-width="2"/><rect x="235" y="235" width="185" height="110" rx="12" fill="#eef8f6" stroke="#168766" stroke-width="2"/><text x="112" y="273" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#7c3eb1">Отказ</text><text x="112" y="310" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253744">Не успех</text><text x="327" y="273" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#168766">Успех</text><text x="327" y="310" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#253744">После ответа</text><text x="220" y="425" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#253744">Изолированные данные теста</text></svg>