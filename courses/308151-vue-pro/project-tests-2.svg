<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 409" role="img"><rect width="440" height="409" rx="18" fill="#f2f8fb"/><text x="220" y="32" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#253744">Неудобные ответы тоже входят в</text><text x="220" y="59" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#253744">контракт</text><circle cx="27" cy="93" r="7" fill="#087c9e"/><text x="47" y="99" font-family="sans-serif" font-size="19" fill="#087c9e">Тест успеха</text><text x="47" y="126" font-family="sans-serif" font-size="18" fill="#253744">Дожидается подтверждения</text><circle cx="27" cy="193" r="7" fill="#7c3eb1"/><text x="47" y="199" font-family="sans-serif" font-size="19" fill="#7c3eb1">Тест отказа</text><text x="47" y="226" font-family="sans-serif" font-size="18" fill="#253744">Не показывает ложный успех</text><circle cx="27" cy="293" r="7" fill="#168766"/><text x="47" y="299" font-family="sans-serif" font-size="19" fill="#168766">Повторный запуск</text><text x="47" y="326" font-family="sans-serif" font-size="18" fill="#253744">Независим от прежних записей</text></svg>