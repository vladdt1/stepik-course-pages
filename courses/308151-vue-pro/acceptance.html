<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запись: клик ещё не означает успех</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#203b48;font:16px/1.55 system-ui}main{padding:14px;max-width:1000px;margin:auto}h2{font-size:19px;margin:0 0 8px}button,input,select{font:inherit;padding:9px;border:1px solid #639aa9;border-radius:8px;max-width:100%}button{cursor:pointer;background:white;color:#164555}button:disabled{opacity:.5;cursor:default}.box{border:1px solid #b8d7df;border-radius:12px;padding:14px;margin:12px 0;background:#eef7fa}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{padding:10px;margin:7px 0;background:#fff;border-radius:8px;border:1px solid #b8d7df}label{display:block}#feedback{min-height:26px;color:#7b378f}#progress{color:#087257;font-weight:600}small{font-size:14px}code{background:#e4eef4;padding:2px 4px}input[type=checkbox]{width:20px;height:20px}p{margin:9px 0}.box{padding:10px;margin:9px 0}main{padding:10px}button{padding:7px 9px}@media(max-width:520px){body{font-size:14px;line-height:1.4}h2{font-size:17px}button,input,select{font-size:14px}small{font-size:13px}.row{gap:7px}}</style><main><h2>Запись: клик ещё не означает успех</h2><p>Начните запись и доставьте отказ сервера. Затем повторите успешно. Проверьте блокировку повторного нажатия.</p><p id="progress">Выполнено 0 из 2</p><div class="row"><button id="book">Записаться</button><button id="success" disabled>Ответ 201</button><button id="conflict" disabled>Ответ 409 FULL</button></div><div class="box">Состояние: <strong id="state">Можно записаться</strong><p id="count">Отправлено запросов: 0</p></div><p id="feedback" role="status" aria-live="polite"></p><div class="row"><button id="hint">Небольшая подсказка</button><button id="reset">Начать заново</button></div></main><script>const HINTS=["Сравните состояние до ответа и после отказа.", "После отказа повторите запрос и доставьте подтверждение сервера."];const $=s=>document.querySelector(s);let completed=new Set();let hintIndex=0;function pass(key,text){completed.add(key);$('#progress').textContent=`Выполнено ${completed.size} из 2`;$('#feedback').textContent=text}function say(t){$('#feedback').textContent=t}$('#hint').onclick=()=>{say(HINTS[Math.min(hintIndex++,HINTS.length-1)])};$('#reset').onclick=()=>location.reload();let pending=false,count=0;function lock(value){pending=value;$('#book').disabled=value;$('#success').disabled=$('#conflict').disabled=!value}$('#book').onclick=()=>{if(pending)return;count++;$('#count').textContent='Отправлено запросов: '+count;$('#state').textContent='Ожидаем ответ сервера';lock(true)};$('#conflict').onclick=()=>{lock(false);$('#state').textContent='Места закончились. Запись не создана.';pass(1,'Отказ не показан как успешная запись. Повтор остаётся возможным.')};$('#success').onclick=()=>{lock(false);$('#book').disabled=true;$('#state').textContent='Вы записаны';if(completed.has(1))pass(2,'Успех появился только после ответа 201.')}</script></html>
