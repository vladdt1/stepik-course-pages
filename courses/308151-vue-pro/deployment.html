<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Почему опубликованная страница не открывается</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#203b48;font:16px/1.55 system-ui}main{padding:14px;max-width:1000px;margin:auto}h2{font-size:19px;margin:0 0 8px}button,input,select{font:inherit;padding:9px;border:1px solid #639aa9;border-radius:8px;max-width:100%}button{cursor:pointer;background:white;color:#164555}button:disabled{opacity:.5;cursor:default}.box{border:1px solid #b8d7df;border-radius:12px;padding:14px;margin:12px 0;background:#eef7fa}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{padding:10px;margin:7px 0;background:#fff;border-radius:8px;border:1px solid #b8d7df}label{display:block}#feedback{min-height:26px;color:#7b378f}#progress{color:#087257;font-weight:600}small{font-size:14px}code{background:#e4eef4;padding:2px 4px}input[type=checkbox]{width:20px;height:20px}p{margin:9px 0}.box{padding:10px;margin:9px 0}main{padding:10px}button{padding:7px 9px}@media(max-width:520px){body{font-size:14px;line-height:1.4}h2{font-size:17px}button,input,select{font-size:14px}small{font-size:13px}.row{gap:7px}}</style><main><h2>Почему опубликованная страница не открывается</h2><p>Исправьте base для Pages и поведение вложенного маршрута. Это модель статического хостинга, а не настоящий сервер.</p><p id="progress">Выполнено 0 из 2</p><div class="box"><p>Адрес: https://example.github.io/events/</p><label>base <select id="base"><option value="/">/</option><option value="/events/">/events/</option></select></label><label>Маршрутизация <select id="router"><option value="history">history без серверного fallback</option><option value="hash">hash</option></select></label><button id="reload">Открыть и обновить страницу события</button></div><div id="browser" class="box">Проверка ещё не запускалась</div><p id="feedback" role="status" aria-live="polite"></p><div class="row"><button id="hint">Небольшая подсказка</button><button id="reset">Начать заново</button></div></main><script>const HINTS=["Адрес папки хостинга влияет на путь файлов сборки.", "Подумайте, какая часть URL отправляется серверу."];const $=s=>document.querySelector(s);let completed=new Set();let hintIndex=0;function pass(key,text){completed.add(key);$('#progress').textContent=`Выполнено ${completed.size} из 2`;$('#feedback').textContent=text}function say(t){$('#feedback').textContent=t}$('#hint').onclick=()=>{say(HINTS[Math.min(hintIndex++,HINTS.length-1)])};$('#reset').onclick=()=>location.reload();$('#reload').onclick=()=>{if($('#base').value!=='/events/'){$('#browser').textContent='Не найден /assets/app.js: ресурсы запрошены от корня домена.';return say('Сопоставьте адрес ресурса с папкой приложения.')}pass(1,'Ресурсы ищутся в папке приложения.');if($('#router').value==='history'){$('#browser').textContent='Первый экран открылся, но GET /events/42 после обновления дал 404.';return say('Кто обрабатывает путь после обновления: Vue или хостинг?')}$('#browser').textContent='Открыт /events/#/events/42. После обновления хостинг отдаёт index.html.';pass(2,'Часть после # обрабатывает клиент; сервер получает путь папки.')}</script></html>
