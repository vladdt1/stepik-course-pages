<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img"><rect width="440" height="520" rx="18" fill="#f2f8fb"/><text x="220" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#253744">Исправляйте причину, а не симптом</text><circle cx="110" cy="160" r="65" fill="#e8f5f5" stroke="#087c9e" stroke-width="2"/><text x="110" y="166" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#087c9e">Симптом</text><circle cx="325" cy="160" r="65" fill="#e8f5f5" stroke="#7c3eb1" stroke-width="2"/><text x="325" y="166" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#7c3eb1">Причина</text><circle cx="220" cy="350" r="65" fill="#e8f5f5" stroke="#168766" stroke-width="2"/><text x="220" y="356" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#168766">Регрессия</text><path d="M175 160 L260 160" fill="none" stroke="#087c9e" stroke-width="3"/><path d="M295 220 L250 285" fill="none" stroke="#7c3eb1" stroke-width="3"/><path d="M185 295 L125 225" fill="none" stroke="#168766" stroke-width="3"/><text x="220" y="470" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#253744">Воспроизвести → исправить →</text><text x="220" y="492" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#253744">проверить</text></svg>