<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Панель: загрузка, успех и ошибка</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#203b48;font:16px/1.55 system-ui}main{padding:14px;max-width:1000px;margin:auto}h2{font-size:19px;margin:0 0 8px}button,input,select{font:inherit;padding:9px;border:1px solid #639aa9;border-radius:8px;max-width:100%}button{cursor:pointer;background:white;color:#164555}button:disabled{opacity:.5;cursor:default}.box{border:1px solid #b8d7df;border-radius:12px;padding:14px;margin:12px 0;background:#eef7fa}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{padding:10px;margin:7px 0;background:#fff;border-radius:8px;border:1px solid #b8d7df}label{display:block}#feedback{min-height:26px;color:#7b378f}#progress{color:#087257;font-weight:600}small{font-size:14px}code{background:#e4eef4;padding:2px 4px}input[type=checkbox]{width:20px;height:20px}p{margin:9px 0}.box{padding:10px;margin:9px 0}main{padding:10px}button{padding:7px 9px}@media(max-width:520px){body{font-size:14px;line-height:1.4}h2{font-size:17px}button,input,select{font-size:14px}small{font-size:13px}.row{gap:7px}}</style><main><h2>Панель: загрузка, успех и ошибка</h2><p>Откройте панель, завершите загрузку ошибкой и повторите успешно. Код панели не загружается до открытия.</p><p id="progress">Выполнено 0 из 2</p><div class="row"><button id="open">Открыть отчёт</button><button id="ok" disabled>Ответ: успех</button><button id="fail" disabled>Ответ: ошибка</button></div><div class="box" id="panel">Панель ещё не запрошена</div><p id="chunks">Загруженных модулей: 0</p><p id="feedback" role="status" aria-live="polite"></p><div class="row"><button id="hint">Небольшая подсказка</button><button id="reset">Начать заново</button></div></main><script>const HINTS=["У ошибки есть собственное состояние интерфейса.", "После ошибки снова откройте панель и доставьте успешный ответ."];const $=s=>document.querySelector(s);let completed=new Set();let hintIndex=0;function pass(key,text){completed.add(key);$('#progress').textContent=`Выполнено ${completed.size} из 2`;$('#feedback').textContent=text}function say(t){$('#feedback').textContent=t}$('#hint').onclick=()=>{say(HINTS[Math.min(hintIndex++,HINTS.length-1)])};$('#reset').onclick=()=>location.reload();let state='idle';function draw(){$('#ok').disabled=$('#fail').disabled=state!=='loading'}$('#open').onclick=()=>{if(state==='loading')return;state='loading';$('#panel').textContent='Загрузка панели…';draw()};$('#fail').onclick=()=>{state='error';$('#panel').textContent='Не удалось загрузить отчёт. Откройте снова для повтора.';draw();pass(1,'Ошибка загрузки отображается отдельно от пустого отчёта.')};$('#ok').onclick=()=>{state='ready';$('#panel').textContent='Отчёт: 12 мероприятий, 8 записей';$('#chunks').textContent='Загруженных модулей: 1';draw();if(completed.has(1))pass(2,'Повторная загрузка завершилась успешно.')}</script></html>
