<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Черновик при переключении вкладок</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#203b48;font:16px/1.55 system-ui}main{padding:14px;max-width:1000px;margin:auto}h2{font-size:19px;margin:0 0 8px}button,input,select{font:inherit;padding:9px;border:1px solid #639aa9;border-radius:8px;max-width:100%}button{cursor:pointer;background:white;color:#164555}button:disabled{opacity:.5;cursor:default}.box{border:1px solid #b8d7df;border-radius:12px;padding:14px;margin:12px 0;background:#eef7fa}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{padding:10px;margin:7px 0;background:#fff;border-radius:8px;border:1px solid #b8d7df}label{display:block}#feedback{min-height:26px;color:#7b378f}#progress{color:#087257;font-weight:600}small{font-size:14px}code{background:#e4eef4;padding:2px 4px}input[type=checkbox]{width:20px;height:20px}p{margin:9px 0}.box{padding:10px;margin:9px 0}main{padding:10px}button{padding:7px 9px}@media(max-width:520px){body{font-size:14px;line-height:1.4}h2{font-size:17px}button,input,select{font-size:14px}small{font-size:13px}.row{gap:7px}}</style><main><h2>Черновик при переключении вкладок</h2><p>Введите заметку и переключитесь туда и обратно. Сравните поведение без кеширования и с KeepAlive.</p><p id="progress">Выполнено 0 из 2</p><label><input id="cache" type="checkbox"> Сохранять экземпляр вкладки</label><div class="row"><button id="edit">Редактор</button><button id="list">Список</button></div><div class="box" id="panel"><label>Черновик <input id="draft" value=""></label></div><p id="life">Созданий редактора: 1</p><p id="feedback" role="status" aria-live="polite"></p><div class="row"><button id="hint">Небольшая подсказка</button><button id="reset">Начать заново</button></div></main><script>const HINTS=["Сначала воспроизведите потерю текста без сохранения экземпляра.", "Включите сохранение, введите новый текст и снова смените вкладку."];const $=s=>document.querySelector(s);let completed=new Set();let hintIndex=0;function pass(key,text){completed.add(key);$('#progress').textContent=`Выполнено ${completed.size} из 2`;$('#feedback').textContent=text}function say(t){$('#feedback').textContent=t}$('#hint').onclick=()=>{say(HINTS[Math.min(hintIndex++,HINTS.length-1)])};$('#reset').onclick=()=>location.reload();let draft='',active='edit',created=1,wrote=false;function show(tab){if(active==='edit'){const input=$('#draft');draft=input?input.value:'';wrote=wrote||!!draft}if(tab==='edit'&&active!=='edit'){created++;if(!$('#cache').checked)draft='';if(wrote){if($('#cache').checked&&draft)pass(2,'Черновик сохранился. Скрытая вкладка ещё не означает уничтоженный экземпляр.');else if(!$('#cache').checked)pass(1,'Черновик исчез после нового создания редактора.')}}active=tab;$('#panel').replaceChildren();if(tab==='edit'){const label=document.createElement('label');label.textContent='Черновик ';const input=document.createElement('input');input.id='draft';input.value=draft;label.append(input);$('#panel').append(label)}else $('#panel').textContent='Список мероприятий';$('#life').textContent='Активаций редактора: '+created}$('#edit').onclick=()=>show('edit');$('#list').onclick=()=>show('list');</script></html>
