<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фильтрация и страницы</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#203b48;font:16px/1.55 system-ui}main{padding:14px;max-width:1000px;margin:auto}h2{font-size:19px;margin:0 0 8px}button,input,select{font:inherit;padding:9px;border:1px solid #639aa9;border-radius:8px;max-width:100%}button{cursor:pointer;background:white;color:#164555}button:disabled{opacity:.5;cursor:default}.box{border:1px solid #b8d7df;border-radius:12px;padding:14px;margin:12px 0;background:#eef7fa}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{padding:10px;margin:7px 0;background:#fff;border-radius:8px;border:1px solid #b8d7df}label{display:block}#feedback{min-height:26px;color:#7b378f}#progress{color:#087257;font-weight:600}small{font-size:14px}code{background:#e4eef4;padding:2px 4px}input[type=checkbox]{width:20px;height:20px}p{margin:9px 0}.box{padding:10px;margin:9px 0}main{padding:10px}button{padding:7px 9px}@media(max-width:520px){body{font-size:14px;line-height:1.4}h2{font-size:17px}button,input,select{font-size:14px}small{font-size:13px}.row{gap:7px}}</style><main><h2>Фильтрация и страницы</h2><p>Найдите Vue, получите вторую страницу и проверьте пустой результат. Сначала фильтрация, потом разбиение на страницы.</p><p id="progress">Выполнено 0 из 2</p><label>Поиск <input id="query" placeholder="Vue"></label><div class="row"><button id="prev">Назад</button><button id="next">Вперёд</button></div><p id="meta"></p><div id="items" class="box"></div><p id="feedback" role="status" aria-live="polite"></p><div class="row"><button id="hint">Небольшая подсказка</button><button id="reset">Начать заново</button></div></main><script>const HINTS=["Отберите тему, для которой результатов больше одной страницы.", "Подберите запрос, которого нет среди названий."];const $=s=>document.querySelector(s);let completed=new Set();let hintIndex=0;function pass(key,text){completed.add(key);$('#progress').textContent=`Выполнено ${completed.size} из 2`;$('#feedback').textContent=text}function say(t){$('#feedback').textContent=t}$('#hint').onclick=()=>{say(HINTS[Math.min(hintIndex++,HINTS.length-1)])};$('#reset').onclick=()=>location.reload();const items=['Vue основы','Go API','Vue формы','SQL','Vue тесты','Docker','Vue Router'];let page=1;function draw(){const q=$('#query').value.trim().toLowerCase(),filtered=items.filter(x=>x.toLowerCase().includes(q)),pages=Math.max(1,Math.ceil(filtered.length/2));page=Math.min(pages,Math.max(1,page));$('#items').replaceChildren();for(const text of filtered.slice((page-1)*2,page*2)){const d=document.createElement('div');d.className='item';d.textContent=text;$('#items').append(d)}if(!filtered.length)$('#items').textContent='Ничего не найдено';$('#meta').textContent=`Страница ${page} из ${pages}; найдено ${filtered.length}`;$('#prev').disabled=page===1;$('#next').disabled=page===pages;if(q==='vue'&&page===2)pass(1,'На второй странице только подходящие события.');if(q&&!filtered.length)pass(2,'Пустой результат не превращается в несуществующую страницу.')}$('#query').oninput=()=>{page=1;draw()};$('#prev').onclick=()=>{page--;draw()};$('#next').onclick=()=>{page++;draw()};draw();</script></html>
